name: wdl-resolveome-align
channels:
  - conda-forge
  - bioconda
dependencies:
  # fastp=0.20.1 (every build) requires zlib<1.3.0a0, which conflicts with
  # samtools=1.20 (already in this env)'s requirement for a newer zlib --
  # this conflict alone made conda's solver take 3+ hours before this was
  # found and still never converge within setup.sh's LSF walltime. Loosened
  # to a modern minimum instead: align_qc.wdl's AlignTrimQC task only uses
  # --thread/--in1/--in2/--out1/--out2/--json/--html/--detect_adapter_for_pe/
  # --trim_poly_g, all stable, long-standing fastp flags still present and
  # verified working in fastp 1.4.0 (what this now resolves to).
  - fastp>=0.23
  - bedtools=2.31.1
  # Must match setup.sh's own cnvkit pin (0.9.14) -- 0.9.12 is NOT
  # installable alongside python=3.11 (see setup.sh's comment next to its
  # own cnvkit pin for why), and conda env update merges this file's specs
  # into the same already-created env, so a mismatched pin here would
  # reintroduce that same solver failure at this later step instead.
  - cnvkit=0.9.14
  # (formerly also pinned preseq=3.2.0 here -- removed: every build of
  # preseq 2.0.3/3.1.2/3.2.0 requires zlib<1.3.0a0, the same conflict as
  # fastp above, and align_qc.wdl's AlignTrimQC task never actually invokes
  # the plain `preseq` binary at all -- it only calls `bam2mr` and
  # `preseq-bioskryb`, this project's own source-built preseq 2.0.3,
  # installed separately by setup_parity_tools.sh below. Confirmed via grep
  # across every wdl/tasks/*.wdl file: zero uses of a bare `preseq` call.)

