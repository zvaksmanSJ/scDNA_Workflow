## Cromwell "Local" backend configuration for wdl/main.wdl.
##
## This workflow intentionally does NOT containerize every single task (only
## DeepVariant/VEP/Manta are individually containerized, via `apptainer exec`
## calls made *inside* their own command blocks -- see each task's docstring).
## The remaining tasks assume the named conda environments created by
## ../setup.sh (wdl-resolveome-align, freec, manta_env, mutsig) are already
## available on the execution host -- exactly matching how this project's
## real LSF/Python pipeline already runs on this HPC cluster.
##
## miniwdl (used for static `miniwdl check` validation of this workflow) is
## NOT usable to actually *run* it, because miniwdl always containerizes the
## full command block of every task and has no "run directly on the host"
## mode. Cromwell's "Local" backend, by contrast, runs each task's rendered
## command script directly via `/bin/bash` on the host where Cromwell itself
## runs, matching this workflow's design. Use Cromwell (this config) to
## execute the workflow; use miniwdl only to statically validate it.
##
## Usage:
##   java -Dconfig.file=wdl/cromwell_local.conf -jar cromwell-87.jar run \
##     wdl/main.wdl -i inputs.json -m outputs.json
##
## Notes:
##   - Requires WDL `version 1.0` (not 1.1) -- Cromwell 87 only recognizes
##     "draft-2" and "1.0" as valid `version` declarations; a `version 1.1`
##     declaration fails to parse at all ("Unknown version '1.1' for
##     workflow language 'WDL'"). Every file under wdl/ already declares
##     `version 1.0` for this reason (confirmed by a real local smoke-test
##     run of tasks/align_qc.wdl's AlignTrimQC task through this exact
##     config -- it produced a real, valid, 100%-mapped BAM + Picard
##     wgs_metrics on synthetic data).
##   - The `runtime-attributes` block below MUST declare `docker`/
##     `docker_user` even though this workflow does not use them at the
##     Cromwell-engine level, because Cromwell's built-in Local/SFS backend
##     config always includes a `submit-docker` template that references
##     `${docker}`; omitting the declaration causes a confusing internal
##     config-validation failure at startup.
##   - Do NOT also redeclare `cpu`/`memory` here: Cromwell's shared
##     filesystem backend provides built-in parsing/validation for those two
##     attributes, and overriding them with a plain `String?` broke
##     `runtime { memory: "~{mem_gb} GB" }` validation in testing
##     ("Unsupported wdl type for memory: WomStringType").
include required(classpath("application"))

backend {
  default = "Local"
  providers {
    Local {
      actor-factory = "cromwell.backend.impl.sfs.config.ConfigBackendLifecycleActorFactory"
      config {
        run-in-background = true
        runtime-attributes = """
          String? docker
          String? docker_user
          String? disks
        """
        submit = "/bin/bash ${script}"
      }
    }
  }
}
