## Cromwell LSF backend configuration for wdl/main.wdl -- for running at real
## multi-cell production scale (as opposed to cromwell_local.conf, which runs
## every task as a local subprocess on one host and does not distribute work
## across the cluster).
##
## Matches this cluster's own bsub conventions exactly (the same flags used
## throughout ../extra_methods/*_lsf.py and ../python_lsf_pipeline/): -q
## <queue>, -n <cpus>, -M <mem_mb>, -R "span[hosts=1] rusage[mem=<mem_mb>]",
## -W <walltime>, -oo/-eo log files, and the "Job <12345> is submitted..."
## stdout format used to extract the job ID.
##
## Usage:
##   java -Dconfig.file=wdl/cromwell_lsf.conf -jar cromwell-87.jar run \
##     main.wdl -i inputs.json -m outputs.json
## (run from workflow_DNA/ root, same as cromwell_local.conf -- see
## wdl/README.md)
##
## Every WDL task's `runtime { cpu: ..., memory: "... GB" }` block is read
## and substituted automatically; `lsf_queue` and `lsf_walltime` are this
## config's own custom attributes (not part of the WDL spec), with sensible
## defaults below -- override per task with e.g. `runtime { lsf_queue:
## "standard", lsf_walltime: "72:00" }` if a specific stage needs something
## different (none of this workflow's tasks currently override them; 48
## hours is comfortably more than any single chunk/cell/chromosome unit of
## work should need, since the WDL already parallelizes each stage down to
## per-cell or per-cell-per-chunk granularity).
include required(classpath("application"))

backend {
  default = "LSF"
  providers {
    LSF {
      actor-factory = "cromwell.backend.impl.sfs.config.ConfigBackendLifecycleActorFactory"
      config {
        # how many LSF jobs Cromwell will have in flight at once across the
        # WHOLE workflow -- raise/lower to match your fair-share/queue
        # policy; 200 is a reasonable starting point for a 25-cell cohort
        # (each cell fans out into many chunk/chromosome-level jobs)
        concurrent-job-limit = 200

        runtime-attributes = """
          Int cpu = 1
          Int memory_mb = 4096
          String? docker
          String? docker_user
          String lsf_queue = "standard"
          String lsf_walltime = "48:00"
        """

        submit = """
          bsub \
            -J ${job_name} \
            -q ${lsf_queue} \
            -n ${cpu} \
            -M ${memory_mb} \
            -R "span[hosts=1] rusage[mem=${memory_mb}]" \
            -W ${lsf_walltime} \
            -oo ${cwd}/execution/stdout \
            -eo ${cwd}/execution/stderr \
            /bin/bash ${script}
        """

        # bsub's own stdout looks like: "Job <12345> is submitted to queue <standard>."
        job-id-regex = "Job <(\\d+)>.*"

        kill = "bkill ${job_id}"
        check-alive = "bjobs ${job_id}"
      }
    }
  }
}
